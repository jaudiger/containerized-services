name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - '**/docker-compose.yml'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  build-docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/build-docker.yml@1bd65c113cef6d5ab752504d277f0b0b3c5bdafa
    with:
      compose-files: &compose_files |
        elasticsearch/cluster/docker-compose.yml
        elasticsearch/secure-cluster/docker-compose.yml
        elasticsearch/single-node/docker-compose.yml
        grafana/single-node/docker-compose.yml
        jaeger/single-node/docker-compose.yml
        kafka/cluster/docker-compose.yml
        kafka/single-node/docker-compose.yml
        kibana/single-node/docker-compose.yml
        mongo/cluster/docker-compose.yml
        mongo/single-node/docker-compose.yml
        mosquitto/single-node/docker-compose.yml
        postgresql/single-node/docker-compose.yml
        prometheus/single-node/docker-compose.yml
        rabbitmq/single-node/docker-compose.yml
        redis/cluster/docker-compose.yml
        redis/replica-set/docker-compose.yml
        redis/single-node/docker-compose.yml
        vault/single-node/docker-compose.yml

  lint-docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-docker.yml@1bd65c113cef6d5ab752504d277f0b0b3c5bdafa
    with:
      compose-files: *compose_files

  lint-actions:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-github-actions.yml@1bd65c113cef6d5ab752504d277f0b0b3c5bdafa

  ci:
    if: always()
    needs: [build-docker, lint-docker, lint-actions]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more required checks failed"
            exit 1
          fi
