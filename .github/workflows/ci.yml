name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - '**/docker-compose.yml'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  build-docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/build-docker.yml@77e9b299266d6b3ff89ae11b0f0db6076d953478
    with:
      compose-files: &compose_files |
        [
          {"path": "elasticsearch/cluster/docker-compose.yml"},
          {"path": "elasticsearch/secure-cluster/docker-compose.yml"},
          {"path": "elasticsearch/single-node/docker-compose.yml"},
          {"path": "grafana/single-node/docker-compose.yml"},
          {"path": "jaeger/single-node/docker-compose.yml"},
          {"path": "kafka/cluster/docker-compose.yml"},
          {"path": "kafka/single-node/docker-compose.yml"},
          {"path": "kibana/single-node/docker-compose.yml"},
          {"path": "mongo/cluster/docker-compose.yml"},
          {"path": "mongo/single-node/docker-compose.yml"},
          {"path": "mosquitto/single-node/docker-compose.yml"},
          {"path": "postgresql/single-node/docker-compose.yml"},
          {"path": "prometheus/single-node/docker-compose.yml"},
          {"path": "rabbitmq/single-node/docker-compose.yml"},
          {"path": "redis/cluster/docker-compose.yml"},
          {"path": "redis/replica-set/docker-compose.yml"},
          {"path": "redis/single-node/docker-compose.yml"},
          {"path": "vault/single-node/docker-compose.yml"}
        ]

  lint-docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-docker.yml@77e9b299266d6b3ff89ae11b0f0db6076d953478
    with:
      compose-files: *compose_files

  lint-actions:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-github-actions.yml@77e9b299266d6b3ff89ae11b0f0db6076d953478

  ci:
    if: always()
    needs: [build-docker, lint-docker, lint-actions]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more required checks failed"
            exit 1
          fi
